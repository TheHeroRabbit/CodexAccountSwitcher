name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt

      - name: Install fixed development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run static checks
        run: python -m ruff check .

      - name: Verify formatting
        run: python -m ruff format --check .

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Check repository safety and integrity
        run: python tools/repository_check.py

      - name: Build release bundle
        shell: pwsh
        run: .\release.ps1 -PythonPath (Get-Command python).Source -SkipTests

      - name: Test release archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath ".\release" -Filter "*.zip" -File
          if ($archive.Count -ne 1) {
              throw "Expected exactly one release ZIP."
          }
          python -m zipfile -t $archive.FullName

      - name: Upload unsigned Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: Codex-switcher-windows-${{ github.sha }}
          path: |
            release/*.zip
            release/*.sha256.txt
          if-no-files-found: error
          retention-days: 14
