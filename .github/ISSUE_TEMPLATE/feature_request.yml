name: 功能建议
description: 提议范围明确、可验证的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明当前遇到的问题，不要包含真实账号、密钥或配置。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的界面、流程或行为。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出如何判断功能已完成且没有破坏现有数据。
    validations:
      required: true
