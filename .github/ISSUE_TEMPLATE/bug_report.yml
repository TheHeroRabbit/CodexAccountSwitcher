name: Bug 报告
description: 报告可稳定复现的功能或界面问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿上传 auth.json、API Key、config.toml、provider_state.dat 或包含真实用户名和本机路径的截图。安全问题请使用仓库的私密安全公告功能。

  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 1.3.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Codex 安装方式
      options:
        - Microsoft Store
        - 其他或不确定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用无敏感信息的最小步骤说明问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: sanitized_evidence
    attributes:
      label: 已脱敏的补充信息
      description: 只附加确认不含凭据、用户名和本机路径的日志或截图。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已确认提交内容不包含认证文件、API Key 或其他敏感信息。
          required: true
