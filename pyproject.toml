[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = ["build", "dist", "release"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/dialog_smoke.py" = ["E402"]
"tools/ui_smoke.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
